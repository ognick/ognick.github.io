<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZabKiss Nutrition</title>
<style>
  :root {
    --primary-text-color: #e0e0e0;
    --secondary-text-color: #a0a0a0;
    --card-background-color: #1e1e1e;
    --background-color: #121212;
    --divider-color: #333;
    --accent-color: #4caf50;
    --accent-hover: #45a049;
    --danger-color: #f44336;
    --danger-hover: #d32f2f;
    --input-background: #2a2a2a;
    --input-border: #444;
    --progress-bg: #333;
    --progress-calories: #ff9800;
    --progress-protein: #2196f3;
    --progress-fat: #e91e63;
    --progress-carbs: #ffc107;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--background-color);
    color: var(--primary-text-color);
    padding: 16px;
    max-width: 800px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4em; margin-bottom: 16px; color: var(--accent-color); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar label { font-size: 0.9em; }
  select, input[type="date"], button {
    padding: 6px 12px;
    background: var(--input-background);
    border: 1px solid var(--input-border);
    color: var(--primary-text-color);
    border-radius: 4px;
    font-size: 0.9em;
  }
  button {
    cursor: pointer;
    border: none;
    background: var(--accent-color);
    color: #fff;
  }
  button:hover { background: var(--accent-hover); }
  button.danger { background: var(--danger-color); }
  button.danger:hover { background: var(--danger-hover); }
  button.small { padding: 4px 8px; font-size: 0.8em; }

  .card {
    background: var(--card-background-color);
    border: 1px solid var(--divider-color);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 1.1em; margin-bottom: 12px; }

  .progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .progress-item { }
  .progress-item .label { font-size: 0.85em; color: var(--secondary-text-color); margin-bottom: 4px; }
  .progress-item .bar {
    height: 8px;
    background: var(--progress-bg);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 2px;
  }
  .progress-item .bar .fill {
    height: 100%; border-radius: 4px; transition: width 0.3s;
  }
  .progress-item.calories .fill { background: var(--progress-calories); }
  .progress-item.protein .fill { background: var(--progress-protein); }
  .progress-item.fat .fill { background: var(--progress-fat); }
  .progress-item.carbs .fill { background: var(--progress-carbs); }
  .progress-item .value { font-size: 0.8em; }

  .meal-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--divider-color); }
  .meal-row:last-child { border-bottom: none; }
  .meal-row .info { flex: 1; }
  .meal-row .info .name { font-weight: 500; }
  .meal-row .info .macros { font-size: 0.8em; color: var(--secondary-text-color); }
  .meal-row .actions { display: flex; gap: 4px; }

  .edit-form { padding: 12px 0; }
  .edit-form input { width: 70px; }

  .profile-form { display: none; }
  .profile-form.open { display: block; }
  .profile-form label { display: block; margin: 8px 0 4px; font-size: 0.85em; color: var(--secondary-text-color); }
  .profile-form input, .profile-form select { width: 100%; max-width: 300px; }
  .profile-form .token-row { display: flex; gap: 8px; align-items: center; }
  .profile-form .token-row input { flex: 1; background: var(--progress-bg); border: none; }

  .loading { text-align: center; padding: 20px; color: var(--secondary-text-color); }
  .empty { text-align: center; padding: 20px; color: var(--secondary-text-color); font-style: italic; }

  #recommendation { font-size: 0.9em; color: var(--secondary-text-color); margin-top: 8px; padding: 8px; background: rgba(76,175,80,0.1); border-radius: 4px; }
</style>
</head>
<body>

<h1>ZabKiss Nutrition</h1>

<div class="toolbar">
  <label>Пользователь:</label>
  <select id="user-select"><option value="">—</option></select>
  <label>Дата:</label>
  <button id="btn-prev">&laquo;</button>
  <input type="date" id="date-picker">
  <button id="btn-next">&raquo;</button>
  <button id="btn-today" class="small">Сегодня</button>
</div>

<div class="card" id="summary-card">
  <h2>Дневная сводка</h2>
  <div id="summary-content" class="loading">Выберите пользователя и дату</div>
  <div id="recommendation"></div>
</div>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer" id="profile-toggle">
    <h2>Настроить профиль</h2>
    <span id="profile-arrow">&#9662;</span>
  </div>
  <div class="profile-form" id="profile-form">
    <form id="targets-form">
      <label>Калории (ккал/день)</label>
      <input type="number" id="f-calories" min="500" max="15000" required>
      <label>Белок (г/день)</label>
      <input type="number" id="f-protein" min="0" required>
      <label>Жиры (г/день)</label>
      <input type="number" id="f-fat" min="0" required>
      <label>Углеводы (г/день)</label>
      <input type="number" id="f-carbs" min="0" required>
      <label>Рост (см)</label>
      <input type="number" id="f-height" min="0" max="300">
      <label>Вес (кг)</label>
      <input type="number" id="f-weight" min="0" max="500" step="0.1">
      <label>Пол</label>
      <select id="f-sex">
        <option value="">Не указан</option>
        <option value="male">Мужской</option>
        <option value="female">Женский</option>
      </select>
      <label>% жира</label>
      <input type="number" id="f-bodyfat" min="0" max="60" step="0.1">
      <div style="margin-top:12px">
        <button type="submit">Сохранить</button>
      </div>
    </form>
    <label style="margin-top:12px">API Token</label>
    <div class="token-row">
      <input type="text" id="f-token" readonly>
      <button id="btn-regenerate" class="small">Перегенерировать</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>Приёмы пищи</h2>
  <div id="meals-list" class="loading">Загрузка...</div>
</div>

<script>
let currentDate = new Date();

const formatDate = d => d.toISOString().slice(0,10);

function setDateStr(s) {
  currentDate = new Date(s + 'T00:00:00');
  document.getElementById('date-picker').value = s;
  loadDay();
}

document.getElementById('date-picker').addEventListener('change', function() {
  setDateStr(this.value);
});
document.getElementById('btn-prev').addEventListener('click', function() {
  let d = new Date(currentDate);
  d.setDate(d.getDate() - 1);
  setDateStr(formatDate(d));
});
document.getElementById('btn-next').addEventListener('click', function() {
  let d = new Date(currentDate);
  d.setDate(d.getDate() + 1);
  setDateStr(formatDate(d));
});
document.getElementById('btn-today').addEventListener('click', function() {
  setDateStr(formatDate(new Date()));
});
document.getElementById('user-select').addEventListener('change', function() {
  loadDay();
  loadTargets();
});

document.getElementById('profile-toggle').addEventListener('click', function() {
  var f = document.getElementById('profile-form');
  var a = document.getElementById('profile-arrow');
  if (f.classList.toggle('open')) {
    a.innerHTML = '&#9652;';
  } else {
    a.innerHTML = '&#9662;';
  }
  loadTargets();
});

document.getElementById('targets-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var uid = document.getElementById('user-select').value;
  if (!uid) return alert('Выберите пользователя');
  var body = JSON.stringify({
    user_id: uid,
    calories: parseInt(document.getElementById('f-calories').value),
    protein: parseInt(document.getElementById('f-protein').value),
    fat: parseInt(document.getElementById('f-fat').value),
    carbs: parseInt(document.getElementById('f-carbs').value),
    height_cm: parseInt(document.getElementById('f-height').value) || 0,
    weight_kg: parseFloat(document.getElementById('f-weight').value) || 0,
    sex: document.getElementById('f-sex').value,
    body_fat_pct: parseFloat(document.getElementById('f-bodyfat').value) || 0
  });
  fetch('/nutrition/api/targets', {
    method: 'PUT',
    headers: {'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},
    body: body
  }).then(r => r.json()).then(d => {
    if (d.ok) {
      loadDay();
    } else {
      alert('Ошибка сохранения');
    }
  });
});

document.getElementById('btn-regenerate').addEventListener('click', function() {
  var uid = document.getElementById('user-select').value;
  if (!uid) return alert('Выберите пользователя');
  if (!confirm('Сменить API токен? Старый токен перестанет работать.')) return;
  fetch('/nutrition/api/targets/' + encodeURIComponent(uid) + '/regenerate-token', {
    method: 'POST',
    headers: {'X-Requested-With':'XMLHttpRequest'}
  }).then(r => r.json()).then(d => {
    document.getElementById('f-token').value = d.token;
  });
});

function loadUsers() {
  fetch('/nutrition/api/users', {headers:{'X-Requested-With':'XMLHttpRequest'}})
    .then(r => r.json()).then(users => {
      var sel = document.getElementById('user-select');
      var cur = sel.value;
      sel.innerHTML = '<option value="">—</option>';
      (users||[]).forEach(function(u) {
        sel.innerHTML += '<option value="'+u+'">'+u+'</option>';
      });
      if (cur && users.indexOf(cur) >= 0) sel.value = cur;
      else if (users.length) { sel.value = users[0]; loadDay(); loadTargets(); }
    });
}

function loadDay() {
  var uid = document.getElementById('user-select').value;
  if (!uid) {
    document.getElementById('summary-content').innerHTML = '<div class="empty">Выберите пользователя</div>';
    document.getElementById('meals-list').innerHTML = '<div class="empty">—</div>';
    return;
  }
  var dateStr = formatDate(currentDate);
  fetch('/nutrition/api/entries?user_id='+encodeURIComponent(uid)+'&date='+dateStr,
    {headers:{'X-Requested-With':'XMLHttpRequest'}})
    .then(r => r.json()).then(entries => {
      renderSummary(entries);
      renderMeals(entries);
    });
}

function loadTargets() {
  var uid = document.getElementById('user-select').value;
  if (!uid) return;
  fetch('/nutrition/api/targets?user_id='+encodeURIComponent(uid),
    {headers:{'X-Requested-With':'XMLHttpRequest'}})
    .then(r => r.json()).then(t => {
      document.getElementById('f-calories').value = t.calories;
      document.getElementById('f-protein').value = t.protein;
      document.getElementById('f-fat').value = t.fat;
      document.getElementById('f-carbs').value = t.carbs;
      document.getElementById('f-height').value = t.height_cm;
      document.getElementById('f-weight').value = t.weight_kg;
      document.getElementById('f-sex').value = t.sex||'';
      document.getElementById('f-bodyfat').value = t.body_fat_pct;
      document.getElementById('f-token').value = t.api_token||'';
    });
}

function renderSummary(entries) {
  var consumed = {calories:0, protein:0, fat:0, carbs:0};
  entries.forEach(function(m) {
    consumed.calories += m.calories||0;
    consumed.protein += m.protein||0;
    consumed.fat += m.fat||0;
    consumed.carbs += m.carbs||0;
  });
  var uid = document.getElementById('user-select').value;
  fetch('/nutrition/api/targets?user_id='+encodeURIComponent(uid),
    {headers:{'X-Requested-With':'XMLHttpRequest'}})
    .then(r => r.json()).then(t => {
      document.getElementById('summary-content').innerHTML = renderBars(consumed, t);
      document.getElementById('recommendation').innerHTML = generateRec(consumed, t);
    });
}

function renderBars(consumed, targets) {
  var bars = [
    {cls:'calories', name:'Калории', val:consumed.calories, target:targets.calories, unit:' ккал'},
    {cls:'protein', name:'Белки', val:consumed.protein, target:targets.protein, unit:' г'},
    {cls:'fat', name:'Жиры', val:consumed.fat, target:targets.fat, unit:' г'},
    {cls:'carbs', name:'Углеводы', val:consumed.carbs, target:targets.carbs, unit:' г'}
  ];
  return '<div class="progress-grid">' + bars.map(function(b) {
    var pct = b.target ? Math.min(100, Math.round(b.val/b.target*100)) : 0;
    return '<div class="progress-item '+b.cls+'"><div class="label">'+b.name+'</div>' +
      '<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>' +
      '<div class="value">'+b.val+b.unit+' / '+b.target+b.unit+' ('+pct+'%)</div></div>';
  }).join('') + '</div>';
}

function generateRec(consumed, targets) {
  var parts = [];
  var remCal = targets.calories - consumed.calories;
  var remP = targets.protein - consumed.protein;
  var remF = targets.fat - consumed.fat;
  var remC = targets.carbs - consumed.carbs;
  if (remCal > 0) parts.push('Осталось '+remCal+' ккал до дневной нормы.');
  if (remP > 0) parts.push('Добавьте '+remP+'г белка.');
  if (remF <= 0 && consumed.fat > targets.fat) parts.push('Норма жиров превышена.');
  if (remC > 50) parts.push('До нормы углеводов осталось '+remC+'г.');
  if (parts.length === 0) parts.push('Норма по всем показателям выполнена!');
  return parts.join(' ');
}

function renderMeals(entries) {
  if (!entries || !entries.length) {
    document.getElementById('meals-list').innerHTML = '<div class="empty">Нет приёмов пищи за этот день</div>';
    return;
  }
  var html = '';
  entries.forEach(function(m) {
    html += '<div class="meal-row" id="meal-'+m.id+'">' +
      '<div class="info">' +
        '<div class="name">'+esc(m.name)+'</div>' +
        '<div class="macros">'+m.calories+' ккал | Б:'+m.protein+' Ж:'+m.fat+' У:'+m.carbs+'</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="small" onclick="editMeal('+m.id+')">Ред.</button>' +
        '<button class="small danger" onclick="deleteMeal('+m.id+')">Уд.</button>' +
      '</div>' +
    '</div>';
  });
  document.getElementById('meals-list').innerHTML = html;
}

function editMeal(id) {
  var row = document.getElementById('meal-'+id);
  var uid = document.getElementById('user-select').value;
  var nameEl = row.querySelector('.name');
  var macrosEl = row.querySelector('.macros');
  var curName = nameEl.textContent;
  var parts = macrosEl.textContent.split(' | ');
  var curCal = parseInt(parts[0]) || 0;
  var curP = parseInt((parts[1]||'').replace(/\D/g,'')) || 0;
  var curF = parseInt((parts[2]||'').replace(/\D/g,'')) || 0;
  var curC = parseInt((parts[3]||'').replace(/\D/g,'')) || 0;

  row.innerHTML =
    '<div class="edit-form">' +
      '<input id="e-name-'+id+'" value="'+escAttr(curName)+'" placeholder="Название" style="width:150px"> ' +
      'Ккал:<input id="e-cal-'+id+'" type="number" value="'+curCal+'" min="0"> ' +
      'Б:<input id="e-p-'+id+'" type="number" value="'+curP+'" min="0"> ' +
      'Ж:<input id="e-f-'+id+'" type="number" value="'+curF+'" min="0"> ' +
      'У:<input id="e-c-'+id+'" type="number" value="'+curC+'" min="0"> ' +
      '<button class="small" onclick="saveMeal('+id+')">Сохранить</button> ' +
      '<button class="small" onclick="loadDay()">Отмена</button>' +
    '</div>';
}

function saveMeal(id) {
  var uid = document.getElementById('user-select').value;
  var body = JSON.stringify({
    user_id: uid,
    name: document.getElementById('e-name-'+id).value,
    calories: parseInt(document.getElementById('e-cal-'+id).value),
    protein: parseInt(document.getElementById('e-p-'+id).value),
    fat: parseInt(document.getElementById('e-f-'+id).value),
    carbs: parseInt(document.getElementById('e-c-'+id).value)
  });
  fetch('/nutrition/api/entries/'+id, {
    method: 'PUT',
    headers: {'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},
    body: body
  }).then(r => r.json()).then(d => {
    if (d.ok) loadDay();
    else alert('Ошибка сохранения');
  });
}

function deleteMeal(id) {
  var uid = document.getElementById('user-select').value;
  if (!confirm('Удалить этот приём пищи?')) return;
  fetch('/nutrition/api/entries/'+id+'?user_id='+encodeURIComponent(uid), {
    method: 'DELETE',
    headers: {'X-Requested-With':'XMLHttpRequest'}
  }).then(r => r.json()).then(d => {
    if (d.ok) loadDay();
    else alert('Ошибка удаления');
  });
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

setDateStr(formatDate(new Date()));
loadUsers();
</script>
</body>
</html>
