name: "ZabKiss"
description: "Natural language smart home control via Alice voice assistant"
version: "0.5.3"
slug: "zabkiss"
init: false
arch:
  - aarch64
map:
  - data:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Alice webhook receiver"
image: "ghcr.io/ognick/zabkiss/zabkiss-addon/{arch}"
options:
  # ── General ──
  log_level: "info"
  ha_token: ""
  ha_url: "http://homeassistant:8123"
  policy_cache_ttl_seconds: 10
  # ── OpenCode API ──
  opencode_api_key: ""
  opencode_base_url: "https://opencode.ai/zen/go/v1"
  # ── Alice Smart Home ──
  allowed_emails: []
  opencode_model: "deepseek-v4-flash"
  # ── YouTube ──
  youtube_api_key: ""
  # ── Telegram / Food Analysis ──
  telegram_bot_token: ""
  telegram_allowed_user_ids: []
  telegram_llm_model: "kimi-k2.6"
ingress: true
ingress_port: 8080
panel_icon: mdi:clipboard-text
panel_title: ZabKiss Nutrition
panel_admin: false
schema:
  log_level: list(debug|info|warn|error)
  ha_token: str
  ha_url: str
  policy_cache_ttl_seconds: int
  opencode_api_key: str
  opencode_base_url: str
  allowed_emails: [str]
  opencode_model: list(deepseek-v4-flash|deepseek-v4-pro|kimi-k2.6|kimi-k2.5|glm-5.1|glm-5|mimo-v2.5-pro|mimo-v2.5)
  youtube_api_key: str?
  telegram_bot_token: str?
  telegram_allowed_user_ids: [str]
  telegram_llm_model: list(kimi-k2.6|kimi-k2.5|glm-5.1|glm-5|deepseek-v4-pro|deepseek-v4-flash|mimo-v2.5-pro|mimo-v2.5)
