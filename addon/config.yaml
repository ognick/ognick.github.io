name: "ZabKiss"
description: "Natural language smart home control via Alice voice assistant"
version: "0.4.2"
slug: "zabkiss"
init: false
arch:
  - aarch64
map:
  - data:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Alice webhook receiver"
image: "ghcr.io/ognick/zabkiss/zabkiss-addon/{arch}"
options:
  log_level: "info"
  ha_token: ""
  ha_url: "http://homeassistant:8123"
  policy_cache_ttl_seconds: 10
  allowed_emails: []
  openai_api_key: ""
  llm_base_url: "https://api.openai.com/v1"
  llm_model: "gpt-4o-mini"
  youtube_api_key: ""
  telegram_bot_token: ""
  telegram_allowed_user_ids: []
  telegram_api_token: ""
  telegram_llm_model: "kimi-k2.6"
  telegram_llm_api_key: ""
  telegram_llm_base_url: "https://api.opencode.ai/v1"
schema:
  log_level: list(debug|info|warn|error)
  ha_token: str
  ha_url: str
  policy_cache_ttl_seconds: int
  allowed_emails: [str]
  openai_api_key: str
  llm_base_url: str
  llm_model: str
  youtube_api_key: str?
  telegram_bot_token: str?
  telegram_allowed_user_ids: [str]
  telegram_api_token: str?
  telegram_llm_model: list(kimi-k2.6|kimi-k2.5|glm-5.1|glm-5|deepseek-v4-pro|deepseek-v4-flash|mimo-v2.5-pro|mimo-v2.5)
  telegram_llm_api_key: str?
  telegram_llm_base_url: str?
