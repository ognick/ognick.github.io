name: "ZabKiss"
description: "Natural language smart home control via Alice voice assistant"
version: "0.5.3"
slug: "zabkiss"
init: false
arch:
  - aarch64
map:
  - data:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Alice webhook receiver"
image: "ghcr.io/ognick/zabkiss/zabkiss-addon/{arch}"
options:
  # ── General ──
  log_level: "info"
  ha_token: ""
  ha_url: "http://homeassistant:8123"
  policy_cache_ttl_seconds: 10
  # ── OpenCode API ──
  opencode_api_key: ""
  opencode_base_url: "https://opencode.ai/zen/go/v1"
  # ── Alice Smart Home ──
  allowed_emails: []
  opencode_model: "deepseek-v4-flash"
  # ── YouTube ──
  youtube_api_key: ""
schema:
  log_level: list(debug|info|warn|error)
  ha_token: str
  ha_url: str
  policy_cache_ttl_seconds: int
  opencode_api_key: str
  opencode_base_url: str
  allowed_emails: [str]
  opencode_model: str
  youtube_api_key: str?
